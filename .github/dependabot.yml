version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-dependencies: { dependency-type: development }
    ignore:
      # typescript-eslint and Next.js do not support TypeScript 7 yet.
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # Solidity libraries (contracts/lib) are git submodules pinned to release tags and
  # upgraded by hand. Dependabot would follow their development branches instead.
