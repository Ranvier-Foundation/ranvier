name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      # The web build bakes the API origin into its CSP and client code; the e2e tests answer that
      # origin themselves (apps/web/tests/e2e/api-mock.ts), so it only has to match.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3199
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The AWS SDK's transitive packages are pinned by pnpm overrides (ADR 0005).
      - run: pnpm --filter @ranvier/api check:aws-overrides
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --filter='!@ranvier/contracts'
      - run: pnpm audit --prod --audit-level high
      # Design tokens: no colour or pixel literals outside apps/web/src/styles/tokens.css.
      - run: pnpm guard:tokens
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @ranvier/web exec playwright install --with-deps chromium
      # Conformance, accessibility, keyboard and reduced-motion tests against the production build.
      - run: pnpm --filter @ranvier/web e2e
      # Strict CSP on the deployable artefact (standalone server.js), ADR 0008: enforcing (hostile
      # runtime env must change nothing), Report-Only only with RANVIER_ENV=staging, a stray
      # CSP_REPORT_ONLY=1 ignored; every page and matcher probe path gets a fresh nonce and no-store.
      - run: pnpm --filter @ranvier/web check:headers

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vvv
      - run: forge fmt --check
      - uses: crytic/slither-action@v0.4.2
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: medium

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI is free for organisations (the gitleaks action needs a licence key).
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
