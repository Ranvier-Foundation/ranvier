packages:
  - apps/*
  - packages/*
  - contracts

# Supply chain (docs/runbooks/dependencies.md): pnpm refuses to resolve, or to install from the
# lockfile, any package version published less than 14 days ago (20160 minutes), including
# transitive ones. `pnpm install --frozen-lockfile` in CI fails on a lockfile entry that breaks it.
minimumReleaseAge: 20160

# Exact versions allowed in although younger than 14 days. Every entry says why and the first (UTC)
# day on which it is 14 days old; delete it on or after that day (the lockfile does not change).
minimumReleaseAgeExclude:
  # apps/api runtime, all pulled by fastify 5.12.5 and kept as tested. Most were released together
  # by the fastify maintainers on 2026-10-10 with request-path hardening (find-my-way 9.10.0 removes
  # quadratic CPU on %25-heavy paths, fast-uri 4.2.2 rejects C0/space-padded URIs); pino 10.4.0
  # changes redaction code. Moving these back would drop fixes in the request path of the signing
  # API.
  - '@fastify/ajv-compiler@4.0.7' # published 2026-10-10; remove on or after 2026-10-25
  - '@fastify/deepmerge@3.2.2' # published 2026-10-04; remove on or after 2026-10-19
  - '@fastify/error@4.2.1' # published 2026-10-10; remove on or after 2026-10-25
  - '@fastify/fast-json-stringify-compiler@5.1.1' # published 2026-10-10; remove on or after 2026-10-25
  - '@fastify/forwarded@3.1.1' # published 2026-10-10; remove on or after 2026-10-25
  - '@fastify/merge-json-schemas@0.2.2' # published 2026-10-10; remove on or after 2026-10-25
  - '@fastify/proxy-addr@5.1.2' # published 2026-10-10; remove on or after 2026-10-25
  - 'avvio@9.3.1' # published 2026-10-10; remove on or after 2026-10-25
  - 'fast-json-stringify@7.1.0' # published 2026-10-10; remove on or after 2026-10-25
  - 'fast-uri@4.2.2' # published 2026-10-10; remove on or after 2026-10-25
  - 'find-my-way@9.10.0' # published 2026-10-10; remove on or after 2026-10-25
  - 'json-schema-ref-resolver@3.0.1' # published 2026-10-10; remove on or after 2026-10-25
  - 'light-my-request@6.8.0' # published 2026-10-10; remove on or after 2026-10-25
  - 'pino@10.4.0' # published 2026-10-02; remove on or after 2026-10-17
  - 'process-warning@5.1.1' # published 2026-10-10; remove on or after 2026-10-25
  - 'safe-regex2@5.1.2' # published 2026-10-10; remove on or after 2026-10-25
  - 'secure-json-parse@4.1.1' # published 2026-10-10; remove on or after 2026-10-25
  - 'set-cookie-parser@3.1.3' # published 2026-10-08; remove on or after 2026-10-23

  # apps/web framework (exact pin). next 16.4.0 contains the fixes for the 2026-10-07 advisories
  # (GHSA-3w37-wq28-93x7, GHSA-39w2-rjm5-chcv); the only patched 16.3 release, 16.3.8, is itself
  # younger than 14 days.
  - '@next/env@16.4.0' # published 2026-10-06; remove on or after 2026-10-21
  - '@next/swc-darwin-arm64@16.4.0' # published 2026-10-06; remove on or after 2026-10-21
  - '@next/swc-darwin-x64@16.4.0' # published 2026-10-06; remove on or after 2026-10-21
  - '@next/swc-linux-arm64-gnu@16.4.0' # published 2026-10-06; remove on or after 2026-10-21
  - '@next/swc-linux-arm64-musl@16.4.0' # published 2026-10-06; remove on or after 2026-10-21
  - '@next/swc-linux-x64-gnu@16.4.0' # published 2026-10-06; remove on or after 2026-10-21
  - '@next/swc-linux-x64-musl@16.4.0' # published 2026-10-06; remove on or after 2026-10-21
  - '@next/swc-win32-arm64-msvc@16.4.0' # published 2026-10-06; remove on or after 2026-10-21
  - '@next/swc-win32-x64-msvc@16.4.0' # published 2026-10-06; remove on or after 2026-10-21
  - 'next@16.4.0' # published 2026-10-06; remove on or after 2026-10-21

  # Test runner (exact pin) and the vite/rolldown chain it resolves. vite 8.3.4 needs postcss
  # ^8.5.29, which needs source-map-js ^1.2.2; the newest vite older than 14 days (8.3.1) predates
  # the 2026-10-06 vite security backports.
  - '@oxc-project/types@0.153.0' # published 2026-10-05; remove on or after 2026-10-20
  - '@rolldown/binding-android-arm-eabi@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-android-arm64@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-darwin-arm64@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-darwin-x64@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-freebsd-x64@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-linux-arm64-gnu@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-linux-arm64-musl@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-linux-ppc64-gnu@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-linux-s390x-gnu@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-linux-x64-gnu@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-linux-x64-musl@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-openharmony-arm64@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-win32-arm64-msvc@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@rolldown/binding-win32-x64-msvc@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - '@vitest/coverage-v8@5.0.3' # published 2026-09-30; remove on or after 2026-10-15
  - '@vitest/mocker@5.0.3' # published 2026-09-30; remove on or after 2026-10-15
  - '@vitest/spy@5.0.3' # published 2026-09-30; remove on or after 2026-10-15
  - 'postcss@8.5.29' # published 2026-10-05; remove on or after 2026-10-20
  - 'rolldown@1.2.13' # published 2026-10-07; remove on or after 2026-10-22
  - 'source-map-js@1.2.2' # published 2026-09-30; remove on or after 2026-10-15
  - 'vite@8.3.4' # published 2026-10-08; remove on or after 2026-10-23
  - 'vitest@5.0.3' # published 2026-09-30; remove on or after 2026-10-15

  # Dev tooling, exact root pins. Moving them changes lint and formatting output for no security
  # gain; they age out within days.
  - '@turbo/darwin-64@2.11.7' # published 2026-10-02; remove on or after 2026-10-17
  - '@turbo/darwin-arm64@2.11.7' # published 2026-10-02; remove on or after 2026-10-17
  - '@turbo/linux-64@2.11.7' # published 2026-10-02; remove on or after 2026-10-17
  - '@turbo/linux-arm64@2.11.7' # published 2026-10-02; remove on or after 2026-10-17
  - '@turbo/windows-64@2.11.7' # published 2026-10-02; remove on or after 2026-10-17
  - '@turbo/windows-arm64@2.11.7' # published 2026-10-02; remove on or after 2026-10-17
  - '@types/node@26.6.5' # published 2026-10-09; remove on or after 2026-10-24
  - '@typescript-eslint/eslint-plugin@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - '@typescript-eslint/parser@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - '@typescript-eslint/project-service@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - '@typescript-eslint/scope-manager@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - '@typescript-eslint/tsconfig-utils@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - '@typescript-eslint/type-utils@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - '@typescript-eslint/types@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - '@typescript-eslint/typescript-estree@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - '@typescript-eslint/utils@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - '@typescript-eslint/visitor-keys@8.71.1' # published 2026-10-05; remove on or after 2026-10-20
  - 'eslint@10.12.0' # published 2026-10-02; remove on or after 2026-10-17
  - 'prettier@3.9.10' # published 2026-10-10; remove on or after 2026-10-25
  - 'turbo@2.11.7' # published 2026-10-02; remove on or after 2026-10-17
  - 'typescript-eslint@8.71.1' # published 2026-10-05; remove on or after 2026-10-20

  # AWS SDK chain (ADR 0005 override). Moving it re-opens the override range check for the KMS
  # signer for a one-day gain.
  - '@smithy/core@3.35.1' # published 2026-09-30; remove on or after 2026-10-15

  # apps/api schema validation (exact pin).
  - 'zod@4.6.6' # published 2026-10-11; remove on or after 2026-10-26

# sharp is only needed for next/image optimisation, which the web app does not use yet.
ignoredOptionalDependencies:
  - sharp

allowBuilds:
  esbuild: true

# The AWS SDK's own transitive packages (credential chain, signing, HTTP) are pinned to releases
# at least 7 days old, chosen so every dependency range of @aws-sdk/client-kms@3.1141.0 and of
# each other is still satisfied. Without this they resolve to whatever is newest within range
# (some were 3 days old). Re-check the set when bumping @aws-sdk/client-kms (ADR 0005).
overrides:
  '@aws-sdk/core': 3.978.1
  '@aws-sdk/credential-provider-env': 3.972.72
  '@aws-sdk/credential-provider-http': 3.972.74
  '@aws-sdk/credential-provider-ini': 3.973.17
  '@aws-sdk/credential-provider-login': 3.972.79
  '@aws-sdk/credential-provider-node': 3.972.84
  '@aws-sdk/credential-provider-process': 3.972.72
  '@aws-sdk/credential-provider-sso': 3.973.16
  '@aws-sdk/credential-provider-web-identity': 3.972.78
  '@aws-sdk/nested-clients': 3.997.46
  '@aws-sdk/signature-v4-multi-region': 3.996.47
  '@aws-sdk/token-providers': 3.1138.0
  '@aws-sdk/types': 3.974.6
  '@aws-sdk/xml-builder': 3.972.41
  '@smithy/core': 3.35.1
  '@smithy/credential-provider-imds': 4.5.2
  '@smithy/fetch-http-handler': 5.8.0
  '@smithy/node-http-handler': 4.12.1
  '@smithy/signature-v4': 5.7.4
  '@smithy/types': 4.19.0
  '@aws/lambda-invoke-store': 0.3.0
